<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Floorball Penalty Showdown</title>
<!--
  FLOORBALL PENALTY SHOWDOWN – 3D-Penaltyschießen im Floorball (Unihockey)
  Eine Datei, startbar per Doppelklick. Einzige externe Abhängigkeit: Three.js (ES-Modul per CDN).
  Alles andere (Geometrie, Texturen, Ton) wird prozedural erzeugt.
-->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
:root{
  --skala:1;
  --bg:#0b1220; --panel:rgba(10,18,34,.94); --panel2:rgba(22,34,58,.96);
  --text:#f4f7fb; --mute:#a9b8cf; --rand:rgba(255,255,255,.16);
  --akzent:#ffd23f; --akzent2:#38c6ff; --gut:#2fd27a; --schlecht:#ff5a5f;
  --tor:#2fd27a; --fehl:#ff5a5f;
}
html.farbenblind{ --gut:#0072b2; --schlecht:#e69f00; --tor:#56b4e9; --fehl:#e69f00; --akzent2:#56b4e9; }
html{ font-size:calc(16px * var(--skala)); }
*{ box-sizing:border-box; }
body{ margin:0; background:#05080f; color:var(--text); overflow:hidden; touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; }
canvas#szene{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }
canvas#vorschau{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:20; pointer-events:none; }
button{ font:inherit; color:inherit; cursor:pointer; }
input,select{ font:inherit; }
.versteckt{ display:none !important; }

/* ---------- Ladebildschirm / Fehler ---------- */
#laden{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
  background:radial-gradient(circle at 50% 40%,#16284a,#05080f 70%); z-index:100; text-align:center; padding:2rem; }
#laden h1{ margin:0; font-size:2rem; letter-spacing:.06em; }
#laden p{ color:var(--mute); max-width:34rem; }

/* ---------- HUD ---------- */
#hud{ position:fixed; inset:0; z-index:10; pointer-events:none; }
#anzeige{ position:absolute; top:max(.6rem,env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  display:flex; align-items:stretch; background:var(--panel); border:1px solid var(--rand); border-radius:.8rem; overflow:hidden;
  box-shadow:0 .4rem 1.4rem rgba(0,0,0,.45); }
.hudTeam{ display:flex; align-items:center; gap:.55rem; padding:.45rem .8rem; }
.hudTeam .kz{ font-weight:800; font-size:1.15rem; letter-spacing:.05em; padding:.1rem .45rem; border-radius:.35rem; }
.hudTeam .punkte{ font-size:1.1rem; letter-spacing:.12em; white-space:nowrap; }
.punkte .p-tor{ color:var(--tor); } .punkte .p-fehl{ color:var(--fehl); } .punkte .p-offen{ color:#56657d; }
#hudStand{ font-size:1.6rem; font-weight:900; padding:.3rem .9rem; background:rgba(255,255,255,.07); display:flex; align-items:center; font-variant-numeric:tabular-nums; }
#hudInfo{ position:absolute; top:calc(max(.6rem,env(safe-area-inset-top)) + 3.6rem); left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--rand); border-radius:.6rem; padding:.3rem .8rem; font-size:.95rem; white-space:nowrap; }
#hudInfo b{ color:var(--akzent); }
#zeitbalken{ position:absolute; top:calc(max(.6rem,env(safe-area-inset-top)) + 6rem); left:50%; transform:translateX(-50%);
  width:min(22rem,60vw); height:.5rem; background:rgba(255,255,255,.12); border-radius:1rem; overflow:hidden; }
#zeitbalken div{ height:100%; width:100%; background:linear-gradient(90deg,var(--gut),var(--akzent)); transform-origin:left; }
#schiri{ position:absolute; bottom:calc(max(1rem,env(safe-area-inset-bottom)) + 5.2rem); left:50%; transform:translateX(-50%);
  background:#111; border:2px solid #fff; border-radius:.7rem; padding:.6rem 1.1rem; font-size:1.15rem; font-weight:700;
  display:flex; gap:.7rem; align-items:center; max-width:92vw; box-shadow:0 .4rem 1.4rem rgba(0,0,0,.5);
  background-image:repeating-linear-gradient(90deg,#111 0 14px,#1d1d1d 14px 28px); }
#schiri .pfeife{ font-size:1.5rem; }
#banner{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); font-size:clamp(2.2rem,7vw,5rem); font-weight:900;
  letter-spacing:.06em; text-shadow:0 .3rem 1.2rem rgba(0,0,0,.6); text-align:center; white-space:nowrap; }
#banner small{ display:block; font-size:.32em; letter-spacing:.1em; font-weight:700; color:var(--mute); }
#hudKnoepfe{ position:absolute; top:max(.6rem,env(safe-area-inset-top)); right:max(.6rem,env(safe-area-inset-right)); display:flex; gap:.5rem; pointer-events:auto; }
.rundKnopf{ width:3.1rem; height:3.1rem; border-radius:50%; border:1px solid var(--rand); background:var(--panel); font-size:1.35rem; display:flex; align-items:center; justify-content:center; }
.rundKnopf:active{ transform:scale(.95); }
#joystick{ position:absolute; width:9rem; height:9rem; margin:-4.5rem 0 0 -4.5rem; border-radius:50%; border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.06); }
#joystick .knopf{ position:absolute; left:50%; top:50%; width:3.4rem; height:3.4rem; margin:-1.7rem 0 0 -1.7rem; border-radius:50%; background:rgba(255,255,255,.5); }
#trickLeiste{ position:absolute; right:max(.8rem,env(safe-area-inset-right)); bottom:calc(max(.8rem,env(safe-area-inset-bottom)) + 2.6rem); display:flex; flex-direction:column; gap:.45rem; pointer-events:auto; }
.trickKnopf{ min-width:7.2rem; min-height:2.9rem; border-radius:2rem; border:1px solid var(--rand); background:var(--panel); font-weight:800; font-size:.95rem; touch-action:none; }
.trickKnopf:active{ background:var(--akzent); color:#111; }
.trickKnopf.raus{ background:var(--schlecht); color:#fff; min-height:3.6rem; font-size:1.15rem; }
#steuerHinweis{ position:absolute; bottom:max(.6rem,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:.3rem .8rem;
  color:var(--mute); font-size:.82rem; background:rgba(4,8,16,.6); padding:.4rem .8rem; border-radius:.6rem; width:max-content; max-width:min(96vw,66rem); }
#steuerHinweis span{ white-space:nowrap; }
#steuerHinweis kbd{ font:inherit; font-weight:800; color:var(--text); background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.24); border-bottom-width:2px; border-radius:.35rem; padding:.02rem .4rem; margin-right:.3rem; }
#tempoAnzeige{ position:absolute; top:calc(max(.6rem,env(safe-area-inset-top)) + 7.1rem); left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--rand);
  border-radius:2rem; padding:.25rem .9rem; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
#tempoAnzeige small{ color:var(--mute); font-weight:600; margin-left:.35rem; }
#trainingInfo{ position:absolute; top:max(.6rem,env(safe-area-inset-top)); left:max(.6rem,env(safe-area-inset-left)); background:var(--panel);
  border:1px solid var(--rand); border-radius:.6rem; padding:.5rem .8rem; font-size:1rem; }
#fps{ position:fixed; left:.4rem; bottom:.4rem; z-index:60; font:12px/1.2 ui-monospace,monospace; background:rgba(0,0,0,.6); padding:.2rem .4rem; border-radius:.3rem; pointer-events:none; }
#debugInfo{ position:fixed; left:.4rem; bottom:1.8rem; z-index:60; font:12px/1.35 ui-monospace,monospace; background:rgba(0,0,0,.7); padding:.4rem .6rem; border-radius:.3rem; pointer-events:none; white-space:pre; }

/* ---------- Menüs ---------- */
#menues{ position:fixed; inset:0; z-index:15; pointer-events:none; }
.bildschirm{ position:absolute; inset:0; pointer-events:auto; overflow:auto; padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(5,9,18,.55),rgba(5,9,18,.88)); display:flex; flex-direction:column; align-items:center; }
.bildschirm.dunkel{ background:rgba(5,9,18,.94); }
.kopfzeile{ width:min(72rem,100%); display:flex; align-items:center; gap:.8rem; margin-bottom:.8rem; }
.kopfzeile h2{ margin:0; font-size:1.6rem; flex:1; }
.titel{ text-align:center; margin:clamp(.5rem,4vh,3rem) 0 clamp(.8rem,3vh,2rem); }
.titel h1{ margin:0; font-size:clamp(2rem,6vw,4.2rem); font-weight:900; letter-spacing:.04em; line-height:1;
  background:linear-gradient(180deg,#fff,#ffd23f); -webkit-background-clip:text; background-clip:text; color:transparent; }
.titel p{ margin:.5rem 0 0; color:var(--mute); letter-spacing:.3em; text-transform:uppercase; font-size:.85rem; }
.menueRaster{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; width:min(56rem,100%); }
@media (max-width:640px){ .menueRaster{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.grossKnopf{ min-height:6.2rem; border-radius:1rem; border:1px solid var(--rand); background:var(--panel2); padding:1rem; text-align:left;
  display:flex; flex-direction:column; justify-content:center; gap:.3rem; font-size:1.25rem; font-weight:800; transition:transform .12s, border-color .12s; }
.grossKnopf small{ font-size:.82rem; font-weight:500; color:var(--mute); }
.grossKnopf .ico{ font-size:1.7rem; }
.grossKnopf:hover,.grossKnopf:focus-visible{ border-color:var(--akzent); transform:translateY(-2px); outline:none; }
.grossKnopf.primaer{ background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:#141414; }
.grossKnopf.primaer small{ color:#3b2c00; }
.knopf{ border-radius:.6rem; border:1px solid var(--rand); background:var(--panel2); padding:.65rem 1.1rem; font-weight:700; min-height:2.9rem; }
.knopf:hover,.knopf:focus-visible{ border-color:var(--akzent); outline:none; }
.knopf.primaer{ background:var(--akzent); color:#141414; border-color:var(--akzent); }
.knopf.gefahr{ border-color:var(--schlecht); color:#ffd3d4; }
.knopf.klein{ padding:.35rem .7rem; min-height:2.2rem; font-size:.9rem; }
.chips{ display:flex; flex-wrap:wrap; gap:.4rem; }
.chip{ border-radius:2rem; border:1px solid var(--rand); background:rgba(255,255,255,.06); padding:.5rem .95rem; font-weight:700; min-height:2.6rem; }
.chip.an{ background:var(--akzent2); color:#06121f; border-color:var(--akzent2); }
.leiste{ width:min(72rem,100%); display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; justify-content:space-between; margin:.6rem 0; }
.karte{ background:var(--panel); border:1px solid var(--rand); border-radius:1rem; padding:1rem; }
.teamRaster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr)); gap:.9rem; width:min(72rem,100%); }
.teamKarte{ position:relative; border-radius:1rem; border:2px solid var(--rand); background:var(--panel); padding:.7rem; text-align:left; overflow:hidden; }
.teamKarte .figurFeld{ height:11rem; border-radius:.7rem; margin:-.2rem -.2rem .5rem; }
.teamKarte h3{ margin:0; font-size:1.05rem; }
.teamKarte .kz{ font-weight:900; font-size:.8rem; padding:.1rem .4rem; border-radius:.3rem; margin-right:.35rem; }
.teamKarte.du{ border-color:var(--akzent); box-shadow:0 0 0 3px rgba(255,210,63,.35); }
.teamKarte.gegner{ border-color:var(--akzent2); box-shadow:0 0 0 3px rgba(56,198,255,.3); }
.teamKarte .marke{ position:absolute; top:.6rem; left:.6rem; font-size:.75rem; font-weight:900; padding:.2rem .5rem; border-radius:.3rem; z-index:2; }
.teamKarte.du .marke{ background:var(--akzent); color:#111; } .teamKarte.gegner .marke{ background:var(--akzent2); color:#111; }
.balken{ display:grid; grid-template-columns:5.2rem 1fr 2rem; gap:.35rem; align-items:center; font-size:.8rem; color:var(--mute); margin-top:.25rem; }
.balken .b{ height:.45rem; background:rgba(255,255,255,.1); border-radius:1rem; overflow:hidden; }
.balken .b i{ display:block; height:100%; background:linear-gradient(90deg,var(--akzent2),var(--akzent)); }
.farben{ display:flex; gap:.3rem; margin-top:.45rem; }
.farben span{ width:1.3rem; height:1.3rem; border-radius:.3rem; border:1px solid rgba(255,255,255,.4); }
.stickyFuss{ position:sticky; bottom:0; width:min(72rem,100%); display:flex; gap:.8rem; justify-content:flex-end; align-items:center; flex-wrap:wrap;
  padding:.8rem 0 .2rem; background:linear-gradient(180deg,transparent,rgba(5,9,18,.95) 35%); margin-top:auto; }
table.tab{ border-collapse:collapse; width:100%; font-size:.95rem; }
table.tab th,table.tab td{ padding:.4rem .5rem; border-bottom:1px solid var(--rand); text-align:left; }
table.tab th{ color:var(--mute); font-weight:600; }
table.tab td.z{ text-align:right; font-variant-numeric:tabular-nums; }
.spalten{ display:grid; grid-template-columns:repeat(auto-fit,minmax(20rem,1fr)); gap:1rem; width:min(72rem,100%); }
.spiel{ display:flex; align-items:center; gap:.6rem; padding:.45rem .2rem; border-bottom:1px solid var(--rand); }
.spiel .wer{ flex:1; } .spiel .erg{ font-weight:800; font-variant-numeric:tabular-nums; }
.spiel.meins .wer{ color:var(--akzent); }
.formular{ display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:.7rem; }
.formular label{ display:flex; flex-direction:column; gap:.25rem; font-size:.85rem; color:var(--mute); }
.formular input,.formular select,.spielerTab input,.spielerTab select{ background:#0d1729; color:var(--text); border:1px solid var(--rand); border-radius:.45rem; padding:.5rem; min-height:2.5rem; }
.formular input[type=color]{ padding:.15rem; height:2.6rem; }
.spielerTab{ width:100%; border-collapse:collapse; font-size:.9rem; margin-top:.6rem; }
.spielerTab td,.spielerTab th{ padding:.25rem; }
.spielerTab input{ width:100%; }
.spielerTab input.zahl{ width:4.2rem; }
.hinweisText{ color:var(--mute); font-size:.9rem; }
.mitte{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; text-align:center; min-height:100%; }
.ergebnisGross{ font-size:clamp(2.5rem,9vw,5.5rem); font-weight:900; font-variant-numeric:tabular-nums; }
.dialog{ width:min(30rem,100%); }
.dialog .knopf{ width:100%; margin-top:.6rem; }
.einstZeile{ display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.55rem 0; border-bottom:1px solid var(--rand); }
.einstZeile > span{ flex:1; }
.tastenKnopf{ min-width:7rem; }
.querHinweis{ position:fixed; inset:auto 0 0 0; z-index:90; background:#1c2a46; text-align:center; padding:.6rem; font-size:.95rem; display:none; }
@media (orientation:portrait) and (max-width:820px) and (pointer:coarse){ .querHinweis{ display:block; } }

/* ---------- Tutorial ---------- */
#tutorial{ position:fixed; inset:0; z-index:45; background:rgba(3,6,12,.8); display:flex; align-items:center; justify-content:center; padding:1rem; }
#tutorial .karte{ width:min(34rem,100%); text-align:center; }
#tutorial .schrittBild{ font-size:3.5rem; margin:.4rem 0; }
#tutorial .punkteReihe{ display:flex; gap:.4rem; justify-content:center; margin:.6rem 0; }
#tutorial .punkteReihe i{ width:.6rem; height:.6rem; border-radius:50%; background:#3a4a66; }
#tutorial .punkteReihe i.an{ background:var(--akzent); }

/* ---------- Tuning-Panel ---------- */
#tuning{ position:fixed; top:0; right:0; bottom:0; width:min(23rem,88vw); z-index:30; background:rgba(8,14,26,.97); border-left:1px solid var(--rand);
  overflow:auto; padding:.8rem .9rem 2rem; transform:translateX(105%); transition:transform .22s ease; pointer-events:auto; touch-action:pan-y; }
#tuning.offen{ transform:none; }
#tuning h2{ margin:.2rem 0 .6rem; font-size:1.25rem; display:flex; align-items:center; justify-content:space-between; }
#tuning details{ border:1px solid var(--rand); border-radius:.6rem; margin:.5rem 0; background:rgba(255,255,255,.03); }
#tuning summary{ padding:.6rem .7rem; font-weight:800; cursor:pointer; }
#tuning .regler{ padding:.25rem .7rem .45rem; }
#tuning .regler label{ display:flex; justify-content:space-between; font-size:.85rem; color:var(--mute); }
#tuning .regler label b{ color:var(--text); font-variant-numeric:tabular-nums; }
#tuning input[type=range]{ width:100%; accent-color:var(--akzent); height:1.6rem; }
#tuning .schalter{ display:flex; justify-content:space-between; align-items:center; padding:.35rem .7rem; font-size:.9rem; }
#tuning .schalter input{ width:1.3rem; height:1.3rem; accent-color:var(--akzent); }
#tuning .zeileKnoepfe{ display:flex; flex-wrap:wrap; gap:.4rem; padding:.3rem .7rem .6rem; }
#tuning select,#tuning input[type=text]{ background:#0d1729; color:var(--text); border:1px solid var(--rand); border-radius:.4rem; padding:.4rem; }
#testErgebnis{ font:12px/1.4 ui-monospace,monospace; padding:.4rem .7rem; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="laden">
  <h1>FLOORBALL PENALTY SHOWDOWN</h1>
  <p id="ladeText">Lade 3D-Engine …</p>
</div>
<div id="hud" class="versteckt">
  <div id="anzeige">
    <div class="hudTeam" id="hudA"><span class="kz"></span><span class="punkte"></span></div>
    <div id="hudStand">0 : 0</div>
    <div class="hudTeam" id="hudB"><span class="punkte"></span><span class="kz"></span></div>
  </div>
  <div id="hudInfo"></div>
  <div id="zeitbalken"><div></div></div>
  <div id="tempoAnzeige" class="versteckt"></div>
  <div id="schiri" class="versteckt"><span class="pfeife">📣</span><span class="text"></span></div>
  <div id="banner" class="versteckt"></div>
  <div id="trainingInfo" class="versteckt"></div>
  <div id="hudKnoepfe">
    <button class="rundKnopf" id="btnKamera" aria-label="Kamera wechseln">🎥</button>
    <button class="rundKnopf" id="btnTuning" aria-label="Tuning">⚙</button>
    <button class="rundKnopf" id="btnPause" aria-label="Pause">⏸</button>
  </div>
  <div id="joystick" class="versteckt"><div class="knopf"></div></div>
  <div id="trickLeiste" class="versteckt"></div>
  <div id="steuerHinweis"></div>
</div>
<div id="menues"></div>
<aside id="tuning" aria-label="Tuning"></aside>
<div id="fps" class="versteckt"></div>
<div id="debugInfo" class="versteckt"></div>
<div class="querHinweis" id="querHinweis"></div>
<input type="file" id="dateiWahl" accept="application/json,.json" class="versteckt">
<script>
  /* Klassisches Skript: meldet, falls das Modul (Three.js vom CDN) nicht geladen werden kann. */
  setTimeout(function(){
    if(!window.__fpsGestartet){
      var el=document.getElementById('ladeText');
      if(el) el.innerHTML='Three.js konnte nicht geladen werden.<br>Bitte Internetverbindung prüfen (die 3D-Engine wird einmalig vom CDN geladen) und die Seite neu laden.';
    }
  }, 12000);
</script>

class AudioSystem {

    try {

    for (const [f, q, g] of baender) {

const Debug = {

  heatmapPunkt(z, y) { this.punkte.push([+z.toFixed(3), +y.toFixed(3)]); if (this.punkte.length > 400) this.punkte.shift(); Speicher.schreiben('fps_heatmap_v1', this.punkte); this.neu = true; },

class DebugAnsicht {
  constructor() {
    this.gruppe = new THREE.Group(); szene.add(this.gruppe);
    this.pfeil = new THREE.ArrowHelper(new V3(1, 0, 0), new V3(), 1, 0xff3b30, 0.12, 0.06); this.gruppe.add(this.pfeil);
    this.kugelGeo = new THREE.SphereGeometry(1, 10, 6); this.hbMat = new THREE.MeshBasicMaterial({ color: 0x38c6ff, wireframe: true, transparent: true, opacity: 0.55 });
    this.hbMat2 = new THREE.MeshBasicMaterial({ color: 0xffd23f, wireframe: true });
    this.hb = []; this.linienGeo = new THREE.BufferGeometry(); this.linienPos = new Float32Array(64 * 6); this.linienGeo.setAttribute('position', new THREE.BufferAttribute(this.linienPos, 3));
    this.linien = new THREE.LineSegments(this.linienGeo, new THREE.LineBasicMaterial({ color: 0x38c6ff })); this.linien.frustumCulled = false; this.gruppe.add(this.linien);
    this.reich = new THREE.Mesh(new THREE.RingGeometry(1.3, 1.34, 64), new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthTest: false }));
    this.reich.rotation.y = -Math.PI / 2; this.gruppe.add(this.reich);
    const [c, g] = leinwand(120, 70); this.hmC = c; this.hmG = g; this.hmTex = texturAus(c);
    this.heat = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), new THREE.MeshBasicMaterial({ map: this.hmTex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
    this.heat.position.set(TOR.x - 0.03, 0.7, 0); this.heat.rotation.y = -Math.PI / 2; this.gruppe.add(this.heat);
    this.info = document.getElementById('debugInfo'); Debug.neu = true; this.gruppe.traverse(o => o.layers.set(2));
  }
  heatmapZeichnen() {
    const g = this.hmG, W = 120, H = 70; g.clearRect(0, 0, W, H);
    const feld = new Float32Array(W * H);
    for (const [z, y] of Debug.punkte) { const cx = (z + 1.2) / 2.4 * W, cy = (1 - y / 1.4) * H; for (let j = Math.max(0, cy - 8 | 0); j < Math.min(H, cy + 8); j++) for (let i = Math.max(0, cx - 8 | 0); i < Math.min(W, cx + 8); i++) { const d2 = (i - cx) ** 2 + (j - cy) ** 2; feld[j * W + i] += Math.exp(-d2 / 14); } }
    let max = 0.001; for (const v of feld) max = Math.max(max, v);
    const img = g.createImageData(W, H);
    for (let i = 0; i < feld.length; i++) { const v = feld[i] / max; if (v < 0.03) continue; const col = new THREE.Color().setHSL(0.66 - v * 0.66, 1, 0.5); img.data[i * 4] = col.r * 255; img.data[i * 4 + 1] = col.g * 255; img.data[i * 4 + 2] = col.b * 255; img.data[i * 4 + 3] = 70 + v * 150; }
    g.putImageData(img, 0, 0); g.strokeStyle = '#fff'; g.strokeRect((0.4 / 2.4) * W, (0.25 / 1.4) * H, (1.6 / 2.4) * W, (1.15 / 1.4) * H);
    this.hmTex.needsUpdate = true; Debug.neu = false;
  }
  update() {
    const D = Config.debug, S = Spiel, T = S.torwart;
    this.pfeil.visible = D.ballvektor && ball.v.lengthSq() > 0.01;
    if (this.pfeil.visible) { this.pfeil.position.copy(ballGruppe.position); this.pfeil.setDirection(_a.copy(ball.v).normalize()); this.pfeil.setLength(Math.min(4, ball.v.length() * 0.12), 0.12, 0.06); }
    const kaps = D.hitboxen && T && S.schuetze ? [...T.fig.kapseln, ...S.schuetze.fig.kapseln].filter(k => k.aktiv || k.besitzer === 'schuetze') : [];
    while (this.hb.length < kaps.length * 2) { const m = new THREE.Mesh(this.kugelGeo, this.hbMat); m.layers.set(2); this.gruppe.add(m); this.hb.push(m); }
    this.hb.forEach((m, i) => { m.visible = i < kaps.length * 2; });
    kaps.forEach((k, i) => { for (const [j, p] of [[0, k.a], [1, k.b]]) { const m = this.hb[i * 2 + j]; m.position.copy(p); m.scale.setScalar(k.r); m.material = k.besitzer === 'schuetze' ? this.hbMat2 : this.hbMat; } this.linienPos.set([k.a.x, k.a.y, k.a.z, k.b.x, k.b.y, k.b.z], i * 6); });
    this.linien.visible = kaps.length > 0; this.linienGeo.setDrawRange(0, kaps.length * 2); this.linienGeo.attributes.position.needsUpdate = true;
    this.reich.visible = D.reichweite && !!T && S.figT.objekt.visible;
    if (this.reich.visible) { const r = 1.0 + T.daten.reflexe / 100 * 0.45; this.reich.scale.setScalar(r / 1.3); this.reich.position.set(TOR.x - 0.04, 0.55, T.pos.z); }
    this.heat.visible = D.heatmap; if (D.heatmap && Debug.neu) this.heatmapZeichnen();
    this.info.classList.toggle('versteckt', !D.physikwerte);
    if (D.physikwerte) {
      const v = ball.v, sp = v.length(), k = 0.5 * RHO * Config.physik.luftwiderstand * BALLD.A / BALLD.m, wl = ball.w.length();
      this.info.textContent = [`Ball  v=${sp.toFixed(2)} m/s (${(sp * 3.6).toFixed(0)} km/h)  h=${ball.p.y.toFixed(2)} m`, `Spin ω=${wl.toFixed(1)} rad/s (${(wl * 9.549).toFixed(0)} U/min)`,
        `a_Luft=${(k * sp * sp).toFixed(1)} m/s²  a_Magnus=${(MAGNUS_K * Config.physik.effet * wl * sp).toFixed(2)} m/s²`, `imTor=${ball.imTor} kinematisch=${ball.kinematisch}`,
        S.schuetze ? `Schütze: ${S.schuetze.zustand} v=${S.schuetze.speed.toFixed(2)} Power=${(S.schuetze.power * 100).toFixed(0)}%` : '',
        T ? `Torhüter: ${T.zustand}${T.gefangen ? ' (gefangen)' : ''} z=${T.pos.z.toFixed(2)} raus=${(TOR.x - T.pos.x).toFixed(2)} m` : '',
        S.versuch ? `Versuch t=${S.versuch.t.toFixed(2)} s  TW-Kontakt=${S.versuch.gkBeruehrt}  Stopp=${S.versuch.stopT.toFixed(2)}` : '', `Spielzustand: ${S.zustand}  Zeitskala: ${S.zeitSkala().toFixed(2)}`].filter(Boolean).join('\n');
    }
  }
}

/* =====================================================================
   MODUL: VORSCHAU – zweiter Renderer für rotierende 3D-Figuren auf Teamkarten und im Editor
   ===================================================================== */
const Vorschau = {
  liste: [], figuren: new Map(), aktiv: false,
  init() {
    this.r = new THREE.WebGLRenderer({ alpha: true, antialias: true }); this.r.domElement.id = 'vorschau'; document.body.appendChild(this.r.domElement);
    this.r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); this.r.toneMapping = THREE.ACESFilmicToneMapping; this.r.setClearColor(0x000000, 0);
    this.szene = new THREE.Scene(); this.szene.add(new THREE.HemisphereLight(0xffffff, 0x404858, 0.5));
    this.szene.environment = umgebungErzeugen(this.r);
    const d = new THREE.DirectionalLight(0xfff2e0, 2.3); d.position.set(2, 4, 3); this.szene.add(d);
    const d2 = new THREE.DirectionalLight(0xbfd6ff, 0.9); d2.position.set(-3, 2, -2); this.szene.add(d2);
    const boden = new THREE.Mesh(new THREE.CircleGeometry(0.75, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })); boden.rotation.x = -Math.PI / 2; this.szene.add(boden);
    this.kam = new THREE.PerspectiveCamera(28, 1, 0.1, 20); this.kam.position.set(0, 1.25, 4.1); this.kam.lookAt(0, 0.92, 0);
    this.groesse();
  },
  groesse() { if (this.r) this.r.setSize(innerWidth, innerHeight); },
  setze(liste) { this.liste = liste; },
  figur(team, key) {
    key = key || team.id; let e = this.figuren.get(key);
    const sp = team.schuetzen[0];
    if (e && e.hand !== sp.hand) { this.szene.remove(e.fig.objekt); e = null; }
    if (!e) { const fig = new Figur({ hand: sp.hand }); this.szene.add(fig.objekt); e = { fig, hand: sp.hand, ent: { s: fig.s, lokBall: new V3(fig.s * 0.12, BALLD.r, 0.55), ballSeite: fig.s, speed: 0, planerPhase: () => 0, dribbelDir: 1 }, anim: new AnimMaschine(POSEN_SCHUETZE), sig: '' }; e.anim.setze('bereit', null, 0); this.figuren.set(key, e); }
    const sig = [team.primaer, team.sekundaer, team.muster, sp.nummer, sp.name].join('|');
    if (e.sig !== sig) { e.fig.setzeTeam(team, sp.nummer, sp.name); e.sig = sig; }
    return e;
  },
  render(now) {
    if (!this.liste.length) { if (this.aktiv) { this.r.setScissorTest(false); this.r.clear(); this.aktiv = false; } return; }
    this.aktiv = true; const r = this.r; r.setScissorTest(false); r.clear(); r.setScissorTest(true);
    for (const e of this.figuren.values()) e.fig.objekt.visible = false;
    const H = innerHeight;
    this.liste.forEach((it, i) => {
      if (!it.el.isConnected) return;
      const rc = it.el.getBoundingClientRect(); const box = it.el.closest('.bildschirm'); const cb = box ? box.getBoundingClientRect() : { top: 0, bottom: H };
      const top = Math.max(rc.top, cb.top), bottom = Math.min(rc.bottom, cb.bottom);
      if (bottom - top < 4 || rc.right < 0 || rc.left > innerWidth) return;
      const e = this.figur(it.holen(), it.key); e.fig.objekt.visible = true;
      const yaw = now * 0.0007 + i * 0.9;
      const P = e.anim.update(1 / 60, e.ent);
      e.fig.anwenden(P, { pos: _n.set(0, 0, 0), yaw, vel: _u.set(0, 0, 0), dt: 1 / 60, blickZiel: null });
      r.setViewport(rc.left, H - rc.bottom, rc.width, rc.height); r.setScissor(rc.left, H - bottom, rc.width, bottom - top);
      this.kam.aspect = rc.width / rc.height; this.kam.updateProjectionMatrix(); r.render(this.szene, this.kam);
      e.fig.objekt.visible = false;
    });
  }
};

    d.querySelectorAll('[data-b]').forEach(el => el.addEventListener('change', () => { Einst[el.dataset.b] = el.checked; einstSpeichern(); einstAnwenden(); }));
    d.querySelectorAll('[data-r]').forEach(el => el.addEventListener('input', () => { Einst[el.dataset.r] = +el.value; einstSpeichern(); einstAnwenden(); }));
    this.klick(d, '[data-taste]', (el) => { el.textContent = t('e_taste_druecken'); Eingabe.belegungWartet = (code) => { Einst.tasten[el.dataset.taste] = code; einstSpeichern(); el.textContent = Eingabe.tastenName(code); }; });
    this.klick(d, '[data-tstd]', () => { Einst.tasten = tief(TASTEN_STANDARD); einstSpeichern(); this.einstellungen(ausPause); });
    this.klick(d, '[data-tut]', () => { Einst.tutorial = false; einstSpeichern(); this.tutorial(); });
  },
  /* ---------- Tutorial (3 Schritte, überspringbar) ---------- */
  tutorialFallsNoetig() { if (!Einst.tutorial) { this.tutorial(); } },
  tutorial() {
    const schritte = [['🕹', t('tut_1')], ['🏒', t('tut_2')], ['🧤', t('tut_3')]]; let i = 0;
    const war = Spiel.pausiert; Spiel.pausiert = true;
    const d = document.createElement('div'); d.id = 'tutorial'; document.body.appendChild(d);
    const zeigen = () => {
      d.innerHTML = `<div class="karte"><h2>${t('tut_titel')} (${i + 1}/3)</h2><div class="schrittBild">${schritte[i][0]}</div><p style="font-size:1.1rem;line-height:1.45">${schritte[i][1]}</p>
        <div class="punkteReihe">${schritte.map((_, k) => `<i class="${k === i ? 'an' : ''}"></i>`).join('')}</div>
        <div class="chips" style="justify-content:center"><button class="knopf" data-skip>${t('tut_skip')}</button><button class="knopf primaer" data-next>${i < 2 ? t('tut_weiter') : t('tut_los')}</button></div></div>`;
      d.querySelector('[data-skip]').onclick = fertig; d.querySelector('[data-next]').onclick = () => { if (i < 2) { i++; zeigen(); } else fertig(); };
    };
    const fertig = () => { d.remove(); Einst.tutorial = true; einstSpeichern(); Spiel.pausiert = war && !!this.pauseEl; };
    zeigen();
  }
};
function einstAnwenden() {
  document.documentElement.style.setProperty('--skala', Einst.schrift);
  document.documentElement.classList.toggle('farbenblind', !!Einst.farbenblind);
  Ton.lautstaerke(Einst.ton);
}

/* =====================================================================
   MODUL: TUNING-PANEL – alle Config-Werte live, Presets, Import/Export, Debug, Regeltests
   ===================================================================== */
const TuningPanel = {
  el: null, offen: false,
  init() {
    this.el = document.getElementById('tuning'); this.bauen();
    Bus.an('config', (p) => { if (p === '*') this.werteAktualisieren(); });
  },
  umschalten() { this.offen ? this.schliessen() : this.oeffnen(); },
  oeffnen() { this.offen = true; this.el.classList.add('offen'); this.werteAktualisieren(); },
  schliessen() { this.offen = false; this.el.classList.remove('offen'); },
  bauen() {
    const eigene = Speicher.lesen('fps_presets_v1', {}) || {};
    const feld = (g, f) => {
      const [k, label, a, b, s, einh] = f, pfad = g + '.' + k, w = cfgGet(pfad);
      if (Array.isArray(a)) return `<div class="schalter"><span>${label}</span><select data-pfad="${pfad}">${a.map(o => `<option value="${o}" ${w === o ? 'selected' : ''}>${t('q_' + o)}</option>`).join('')}</select></div>`;
      if (typeof STANDARD[g][k] === 'boolean') return `<label class="schalter"><span>${label}</span><input type="checkbox" data-pfad="${pfad}" ${w ? 'checked' : ''}></label>`;
      return `<div class="regler"><label><span>${label}</span><b data-wert="${pfad}">${(+w).toFixed(s < 1 ? (s < 0.1 ? 2 : 1) : 0)}${einh || ''}</b></label><input type="range" min="${a}" max="${b}" step="${s}" value="${w}" data-pfad="${pfad}" data-einh="${einh || ''}" data-schritt="${s}"></div>`;
    };
    this.el.innerHTML = `<h2>⚙ ${t('tuning')} <button class="knopf klein" data-zu>✕</button></h2>
      <details open><summary>${t('tu_presets')}</summary><div class="zeileKnoepfe">
        <button class="knopf klein" data-preset="arcade">${t('tu_arcade')}</button><button class="knopf klein" data-preset="realistisch">${t('tu_realistisch')}</button><button class="knopf klein" data-preset="simulation">${t('tu_simulation')}</button></div>
        <div class="zeileKnoepfe"><input type="text" data-pname placeholder="${t('tu_name')}" maxlength="24" style="flex:1"><button class="knopf klein" data-psave>${t('tu_speichern')}</button></div>
        <div class="zeileKnoepfe" data-eigene>${Object.keys(eigene).map(n => `<span class="chips"><button class="knopf klein" data-pload="${esc(n)}">${esc(n)}</button><button class="knopf klein gefahr" data-pdel="${esc(n)}">${t('tu_loeschen')}</button></span>`).join('') || `<span class="hinweisText">–</span>`}</div>
        <div class="zeileKnoepfe"><button class="knopf klein" data-pexp>${t('tu_export')}</button><button class="knopf klein" data-pimp>${t('tu_import')}</button><button class="knopf klein gefahr" data-preset="realistisch">${t('tu_reset')}</button></div>
        <div class="zeileKnoepfe hinweisText" data-pmeld></div></details>
      ${TUNING_SCHEMA.map(gr => `<details ${gr.g === 'physik' ? 'open' : ''}><summary>${gr.titel}</summary>${gr.f.map(f => feld(gr.g, f)).join('')}</details>`).join('')}
      <details><summary>${t('tu_debug')}</summary>${[['ballvektor', 'Ballvektor'], ['hitboxen', 'Hitboxen'], ['reichweite', 'Torhüter-Reichweite'], ['heatmap', 'Heatmap der Schussziele'], ['physikwerte', 'Physikwerte in Echtzeit']].map(([k, l]) => `<label class="schalter"><span>${l}</span><input type="checkbox" data-pfad="debug.${k}" ${Config.debug[k] ? 'checked' : ''}></label>`).join('')}
        <div class="zeileKnoepfe"><button class="knopf klein" data-hmreset>${t('tu_heat_reset')}</button><button class="knopf klein primaer" data-tests>${t('tu_tests')}</button></div><div id="testErgebnis"></div></details>`;
    const E = this.el;
    E.querySelectorAll('[data-pfad]').forEach(inp => {
      const ev = inp.type === 'range' ? 'input' : 'change';
      inp.addEventListener(ev, () => {
        const p = inp.dataset.pfad; let w = inp.type === 'checkbox' ? inp.checked : inp.type === 'range' ? +inp.value : inp.value;
        if (p.startsWith('debug.')) { Config.debug[p.slice(6)] = w; return; }
        cfgSet(p, w); this.wertAnzeige(p, w, inp);
      });
    });
    E.querySelector('[data-zu]').onclick = () => this.schliessen();
    E.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { presetAnwenden(PRESETS[b.dataset.preset]); this.meldung(b.textContent + ' ✓'); });
    E.querySelector('[data-psave]').onclick = () => { const n = E.querySelector('[data-pname]').value.trim().slice(0, 24); if (!n) return; const o = Speicher.lesen('fps_presets_v1', {}) || {}; o[n] = this.aktuelleWerte(); Speicher.schreiben('fps_presets_v1', o); this.eigeneAnzeigen(o); this.meldung(n + ' ✓'); };
    E.querySelector('[data-pexp]').onclick = () => datenDownload('floorball-tuning.json', { format: 'floorball-penalty-tuning', version: 1, werte: this.aktuelleWerte() });
    E.querySelector('[data-pimp]').onclick = async () => { const j = await jsonWaehlen(); const w = j && (j.werte || j); if (!w || typeof w !== 'object') return this.meldung(t('tu_import_fehler')); presetAnwenden(this.saeubern(w)); this.meldung(t('tu_import_ok')); };
    E.querySelector('[data-hmreset]').onclick = () => Debug.leeren();
    E.querySelector('[data-tests]').onclick = () => { const r = Regeltests.ausfuehren(); document.getElementById('testErgebnis').textContent = r.map(x => `${x.ok ? '✔' : '✘'} ${x.name}${x.ok ? '' : ' (' + x.info + ')'}`).join('\n') + `\n${r.filter(x => x.ok).length}/${r.length} bestanden`; };
    this.eigeneBinden();
  },
  eigeneAnzeigen(o) {
    const box = this.el.querySelector('[data-eigene]');
    box.innerHTML = Object.keys(o).map(n => `<span class="chips"><button class="knopf klein" data-pload="${esc(n)}">${esc(n)}</button><button class="knopf klein gefahr" data-pdel="${esc(n)}">${t('tu_loeschen')}</button></span>`).join('') || `<span class="hinweisText">–</span>`;
    this.eigeneBinden();
  },
  eigeneBinden() {
    this.el.querySelectorAll('[data-pload]').forEach(b => b.onclick = () => { const o = Speicher.lesen('fps_presets_v1', {}) || {}; if (o[b.dataset.pload]) { presetAnwenden(this.saeubern(o[b.dataset.pload])); this.meldung(b.dataset.pload + ' ✓'); } });
    this.el.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => { const o = Speicher.lesen('fps_presets_v1', {}) || {}; delete o[b.dataset.pdel]; Speicher.schreiben('fps_presets_v1', o); this.eigeneAnzeigen(o); });
  },
  meldung(s) { const m = this.el.querySelector('[data-pmeld]'); if (m) m.textContent = s; },
  aktuelleWerte() { const o = {}; for (const g of TUNING_GRUPPEN) o[g] = tief(Config[g]); return o; },
  /** Nur bekannte Schlüssel mit passendem Typ und im erlaubten Bereich übernehmen. */
  saeubern(w) {
    const o = {};
    for (const gr of TUNING_SCHEMA) { if (!TUNING_GRUPPEN.includes(gr.g) || !w[gr.g] || typeof w[gr.g] !== 'object') continue; o[gr.g] = {};
      for (const [k, , a, b] of gr.f) { const v = w[gr.g][k], std = STANDARD[gr.g][k];
        if (typeof std === 'boolean' && typeof v === 'boolean') o[gr.g][k] = v;
        else if (typeof std === 'number' && Number.isFinite(+v)) o[gr.g][k] = klemme(+v, a, b); } }
    return o;
  },
  wertAnzeige(p, w, inp) { const b = this.el.querySelector(`[data-wert="${p}"]`); if (b && inp) { const s = +inp.dataset.schritt; b.textContent = (+w).toFixed(s < 1 ? (s < 0.1 ? 2 : 1) : 0) + inp.dataset.einh; } },
  werteAktualisieren() {
    if (!this.el) return;
    this.el.querySelectorAll('[data-pfad]').forEach(inp => {
      const p = inp.dataset.pfad, w = p.startsWith('debug.') ? Config.debug[p.slice(6)] : cfgGet(p);
      if (inp.type === 'checkbox') inp.checked = !!w; else inp.value = w;
      if (inp.type === 'range') this.wertAnzeige(p, w, inp);
    });
  }
};

/* =====================================================================
   HAUPTSCHLEIFE – fester Physik-Zeitschritt (120 Hz), Render-Interpolation
   ===================================================================== */
let letzteZeit = performance.now(), akku = 0, fpsZaehler = 0, fpsZeit = 0;
function frame(jetzt) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (jetzt - letzteZeit) / 1000)); letzteZeit = jetzt;
  Eingabe.pollen();
  Eingabe.joyZone = (Spiel.menschSchiesst || Spiel.menschHaelt) && ['aufstellung', 'anlauf'].includes(Spiel.zustand) && !Spiel.pausiert;
  for (const e of Eingabe.holeEreignisse()) {
    if (e.typ === 'tuning') { TuningPanel.umschalten(); continue; }
    if (e.typ === 'pause') { if (TuningPanel.offen && !['anlauf', 'aufstellung', 'auswertung', 'intro', 'wiederholung'].includes(Spiel.zustand)) TuningPanel.schliessen(); else UI.pauseUmschalten(); continue; }
    if (!Spiel.pausiert) Spiel.ereignis(e);
  }
  if (!Spiel.pausiert && Spiel.simAktiv()) {
    akku += dt * Spiel.zeitSkala(); let n = 0;
    while (akku >= DT && n < 12) { Spiel.schritt(DT); akku -= DT; n++; }
    if (n >= 12) akku = 0;
  }
  Spiel.render(Spiel.pausiert ? 0 : dt, klemme(akku / DT, 0, 1));
  HUD.joystick();
  Bild.zeichne(dt); Bild.regeln(dt);
  Vorschau.render(jetzt);
  fpsZaehler++; fpsZeit += dt;
  if (fpsZeit > 0.5) { if (Config.grafik.fps) document.getElementById('fps').textContent = `${Math.round(fpsZaehler / fpsZeit)} FPS · ${renderer.info.render.calls} Draw Calls`; fpsZaehler = 0; fpsZeit = 0; }
}
function start() {
  TeamDB.laden(); Turnier.laden(); einstAnwenden();
  HUD.init(); UI.init(); initSzene(); Vorschau.init(); Spiel.init(); Eingabe.init(renderer.domElement); TuningPanel.init();
  document.getElementById('laden').remove();
  UI.hauptmenue();
  document.addEventListener('visibilitychange', () => { if (document.hidden && ['anlauf', 'aufstellung'].includes(Spiel.zustand) && !Spiel.pausiert) UI.pauseAuf(); });
  window.__fps = { loeseSchuss, simuliereBisX, V3, THREE, renderer, szene, kamera, halle, Bild, Spiel, Config, Regeltests, Turnier, TeamDB, ball, UI, Eingabe, Kam, HUD, Ton, presetAnwenden, PRESETS, cfgSet, TuningPanel, Einst, Shootout };
  requestAnimationFrame((t0) => { letzteZeit = t0; frame(t0); });
}
try { start(); }
catch (err) {
  const el = document.getElementById('ladeText');
  if (el) el.textContent = 'Start fehlgeschlagen: ' + (err && err.message ? err.message : err) + ' – WebGL wird benötigt.';
  throw err;
}
</script>
