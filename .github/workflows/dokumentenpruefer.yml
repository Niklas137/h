name: Dokumentenpruefer Phase 1

on:
  push:
    branches: [codex/dokumentenpruefer, codex/dokumentenpruefer-satzlaenge]
    paths: ['dokumentenpruefer/**', '.github/workflows/dokumentenpruefer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abnahme:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dokumentenpruefer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python-Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Gesamtpruefung einschliesslich Neustart und Wiederherstellung
        env:
          DP_TEST_PYTHON: python
        run: bash abnahme.command
      - name: Browser installieren
        run: |
          npm install --prefix "$RUNNER_TEMP/dp-browser" playwright@1.62.1
          node "$RUNNER_TEMP/dp-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Browser-Abnahme
        env:
          NODE_PATH: ${{ runner.temp }}/dp-browser/node_modules
          DP_TEST_PYTHON: python
        run: node tests/browser_smoke.cjs
      - name: WebKit-Abnahme
        env:
          NODE_PATH: ${{ runner.temp }}/dp-browser/node_modules
          DP_TEST_PYTHON: python
          DP_TEST_BROWSER: webkit
        run: node tests/browser_smoke.cjs
      - name: Pruefnachweise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokumentenpruefer-${{ matrix.os }}
          path: dokumentenpruefer/test-artifacts/
          if-no-files-found: ignore
